# One command: `docker compose up --build`. Starts anvil, deploys and seeds the contracts,
# then starts the Indexer, Risk Engine and Liquidator. The scenario runs under the `scenario` profile.
name: vigil

x-service-env: &service-env
  RPC_URL: http://anvil:8545
  DEPLOYMENT_FILE: /deployments/31337.json
  DATABASE_URL: postgres://vigil@postgres:5432/vigil
  NATS_URL: nats://nats:4222
  RUST_LOG: info

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vigil
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: vigil
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 2s
      retries: 30

  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      retries: 30

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--block-time", "1"]
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      retries: 30

  indexer:
    build:
      context: ./services
      dockerfile: Dockerfile.indexer
    container_name: vigil-indexer
    environment:
      RPC_URL: "http://anvil:8545"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vigil}"
      NATS_URL: "nats://nats:4222"
      RUST_LOG: "info,indexer=debug"
      METRICS_PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      <<: *service-env
    volumes:
      - ./contracts/deployments:/deployments:ro

  risk-engine:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        BIN: vigil-risk-engine
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      <<: *service-env
      HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    volumes:
      - ./contracts/deployments:/deployments:ro

  liquidator:
    build:
      context: .
      dockerfile: services/liquidator/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      <<: *service-env
      KEYSTORE_PATH: /keystore/liquidator.json
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-vigil-dev-password}
    restart: unless-stopped
    volumes:
      - ./contracts/deployments:/deployments:ro
      - keystore:/keystore:ro

volumes:
  keystore:
